apiVersion: v1
kind: Secret
metadata:
  name: ds-agent-activation
  namespace: openshift
type: Opaque
data:
  dsmUrl: {{ required "dsmUrl is required" .Values.dsmUrl | toString | b64enc | quote }}
  {{- with .Values.dsmProxy }}
  dsmProxy: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.proxyCredential }}
  proxyCredential: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.relayProxy }}
  relayProxy: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with .Values.relayProxyCredential }}
  relayProxyCredential: {{ . | toString | b64enc | quote }}
  {{- end }}
