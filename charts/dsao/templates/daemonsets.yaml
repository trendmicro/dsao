apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ds-agent
  namespace: openshift
spec:
  selector:
    matchLabels:
      app: ds-agent
  template:
    metadata:
      labels:
        app: ds-agent
      annotations:
        checksum/activation: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
      - name: ds-agent
        image: >-
          {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "512Mi"
          limits:
            memory: "2Gi"
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /sys
          name: sys
        - mountPath: /var/lib/crio/crio.sock
          name: crio
          subPath: crio.sock
          readOnly: true
        - mountPath: /var/lib/crio/version
          name: crio
          subPath: version
          readOnly: true
        - mountPath: /host/etc/os-release
          name: osrelease
          readOnly: true
        - mountPath: /etc/ds-activation
          name: activation
          readOnly: true
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                exec > /var/log/poststart.log 2>&1
                mkdir -v /var/run/crio
                ln -v -s /var/lib/crio/crio.sock /var/run/crio/crio.sock
                sleep 30s
                /opt/ds_agent/dsa_control -t 15 -r
                # Activation settings come from the ds-agent-activation Secret.
                # Values are only ever passed as quoted arguments, never
                # evaluated as shell code, and never echoed to the log.
                act=/etc/ds-activation
                if [ -s "$act/dsmProxy" ]; then
                  /opt/ds_agent/dsa_control -x "$(cat "$act/dsmProxy")"
                fi
                if [ -s "$act/proxyCredential" ]; then
                  /opt/ds_agent/dsa_control -u "$(cat "$act/proxyCredential")"
                fi
                if [ -s "$act/relayProxy" ]; then
                  /opt/ds_agent/dsa_control -y "$(cat "$act/relayProxy")"
                fi
                if [ -s "$act/relayProxyCredential" ]; then
                  /opt/ds_agent/dsa_control -w "$(cat "$act/relayProxyCredential")"
                fi
                if [ ! -s "$act/dsmUrl" ]; then
                  echo "dsmUrl is missing from the ds-agent-activation Secret"
                  exit 1
                fi
                # dsmUrl is the activation URL optionally followed by
                # space-separated, double-quoted "key:value" items, e.g.
                #   dsm://host:443/ "token:..." "policyid:1"
                # Split on whitespace (read does no glob or command
                # expansion) and strip one pair of surrounding quotes.
                read -r -a items < "$act/dsmUrl"
                args=()
                for item in "${items[@]}"; do
                  item="${item#\"}"
                  item="${item%\"}"
                  args+=("$item")
                done
                /opt/ds_agent/dsa_control -t 15 -a "${args[@]}" "hostname:$TM_DS_DSAO_HN"
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - systemctl stop ds_agent
        startupProbe:
          exec:
            command:
            - /opt/ds_agent/dsa_query
            - -c
            - GetAgentStatus
          periodSeconds: 60
          timeoutSeconds: 60
        livenessProbe:
          exec:
            command:
            - /opt/ds_agent/dsa_query
            - -c
            - GetAgentStatus
          periodSeconds: 3600
          timeoutSeconds: 60
          successThreshold: 1
          failureThreshold: 24
        env:
          - name: TM_DS_DSAO_HN
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
      volumes:
      - name: sys
        hostPath:
          path: /sys
      - name: crio
        hostPath:
          path: /var/run/crio
      - name: osrelease
        hostPath:
          path: /etc/os-release
      - name: activation
        secret:
          secretName: ds-agent-activation
          defaultMode: 0400
      serviceAccount: dsa-service-account
      tolerations:
      - operator: Exists
